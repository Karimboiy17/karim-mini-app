<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karim AI — sahifalar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="assets/tg.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Karim AI</h1>
  <span class="sub">so‘ralgan tushuntirishlar · har biri alohida sahifa</span>
</header>

<main id="app" class="grid"></main>
<div class="hint">Yangi sahifa yuqorida turadi · eskisi o‘chmaydi</div>

<script>
  const app = document.getElementById('app');

  function render(items) {
    if (!items.length) {
      app.innerHTML = '<div class="empty">Hozircha bo‘sh.</div>';
      return;
    }
    app.innerHTML = items.map(it => `
      <a class="card" href="${it.page}" data-id="${it.id}">
        ${it.image ? `<img class="thumb" src="${it.image}" alt="" loading="lazy">` : ''}
        <h2>${it.title}</h2>
        <div class="meta">
          <span>${it.date || ''}</span>
          ${it.subtitle ? `<span>${it.subtitle}</span>` : ''}
        </div>
      </a>
    `).join('');
  }

  fetch('items.json?v=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json())
    .then(list => render(list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))))
    .catch(() => { app.innerHTML = '<div class="empty">Yuklanmadi. ⌘R bosib qayta urinib ko‘ring.</div>'; });

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#0d0f12'); tg.setBackgroundColor('#0d0f12'); } catch (e) {} }
</script>
</body>
</html>
