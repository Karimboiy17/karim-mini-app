<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karim AI — ko‘rsatmalar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d0f12; color: #e8eaee;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    padding: 18px 16px 40px; -webkit-tap-highlight-color: transparent;
  }
  header { margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; letter-spacing: .2px; }
  .sub { color: #8b929e; font-size: 13px; }
  .card {
    background: #16191f; border: 1px solid #272c35; border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card h2 { font-size: 16px; margin: 0; font-weight: 650; line-height: 1.3; }
  .date { color: #6b7280; font-size: 12px; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; }
  .tag { color: #22c55e; font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin-top: 4px; }
  .shot { width: 100%; border-radius: 10px; margin: 12px 0 4px; background: #0d0f12; display: block; }
  ul { margin: 10px 0 0; padding-left: 18px; }
  li { color: #c9ced6; font-size: 14px; line-height: 1.55; margin-bottom: 6px; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 12px; text-align: center; }
  .empty { color: #8b929e; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Karim AI</h1>
  <div class="sub">So‘ralgan tushuntirishlar va sxemalar</div>
</header>
<main id="app"></main>
<div class="hint">Yangi qo‘shilganlar yuqorida turadi</div>

<script src="data.js"></script>
<script>
  const app = document.getElementById('app');
  const items = (window.ITEMS || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  if (!items.length) {
    app.innerHTML = '<div class="empty">Hozircha bo‘sh.</div>';
  } else {
    app.innerHTML = items.map(it => `
      <section class="card">
        <div class="row">
          <h2>${it.title}</h2>
          <span class="date">${it.date || ''}</span>
        </div>
        ${it.subtitle ? `<div class="tag">${it.subtitle}</div>` : ''}
        ${it.image ? `<img class="shot" src="${it.image}" alt="${it.title}" loading="lazy">` : ''}
        ${it.notes && it.notes.length ? `<ul>${it.notes.map(n => `<li>${n}</li>`).join('')}</ul>` : ''}
      </section>
    `).join('');
  }

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#0d0f12'); tg.setBackgroundColor('#0d0f12'); } catch (e) {} }
</script>
</body>
</html>
